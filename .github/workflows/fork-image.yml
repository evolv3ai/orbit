name: Fork image

# Builds the fork's own Orbit image (ghcr.io/evolv3ai/orbit) from the ONLYOFFICE branch. The stock
# image refuses to start on the `ORBIT_ONLYOFFICE_*` variables, so the integration needs this one.
# Tags: `<short sha>` for the commit, and the branch name with `/` as `-` (`feat-onlyoffice`), which
# moves with the branch.
#
# Build and push only. Nothing here deploys, and it has no release job: upstream's
# `image.yml` keeps those. Switching a server to this image is a separate, manual step.
on:
  push:
    branches: [feat/onlyoffice]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    # Never from another repository that receives this file (for example upstream).
    if: github.repository == 'evolv3ai/orbit'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            uname: x86_64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            uname: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify native build host
        env:
          EXPECTED_UNAME: ${{ matrix.uname }}
        run: |
          test "$(uname -m)" = "$EXPECTED_UNAME"
          test "$(docker info --format '{{.Architecture}}')" = "$EXPECTED_UNAME"
      - name: Read version from Cargo.toml
        id: version
        run: echo "version=$(bash scripts/version.sh)" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Set image name
        id: image
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}-${ARCHITECTURE}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
      - name: Build native image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: ORBIT_BUILD_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.image.outputs.name }}
          load: true
          cache-from: type=gha,scope=orbit-fork-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=orbit-fork-${{ matrix.architecture }}
      - name: Verify and smoke-test native image
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          test "$(docker image inspect "$IMAGE" --format '{{.Architecture}}')" = "$ARCHITECTURE"
          docker run --rm "$IMAGE" --help
          bash deploy/smoke.sh "$IMAGE"
      - name: Publish architecture image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: docker push "$IMAGE"

  publish:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish multi-platform manifest
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag=${GITHUB_SHA::7}
          branch=${GITHUB_REF_NAME//\//-}
          docker buildx imagetools create \
            --tag "$image:$tag" --tag "$image:$branch" \
            "$image:$tag-amd64" \
            "$image:$tag-arm64"
          docker buildx imagetools inspect "$image:$tag" | tee manifest.txt
          grep -E 'Platform:[[:space:]]+linux/amd64' manifest.txt
          grep -E 'Platform:[[:space:]]+linux/arm64' manifest.txt
